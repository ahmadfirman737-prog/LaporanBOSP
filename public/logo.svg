<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Gold Rim Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755" />
      <stop offset="25%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#F3D478" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#916508" />
    </linearGradient>

    <!-- Outer Triangle Clip Paths & Gradients -->
    <linearGradient id="greenLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009F48" />
      <stop offset="100%" stop-color="#00833D" />
    </linearGradient>

    <linearGradient id="greenRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007936" />
      <stop offset="100%" stop-color="#00632C" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Left Text Path: YAYASAN PENDIDIKAN (bottom-left curving up to apex) -->
    <!-- Arc from (135, 780) curving up to (435, 145) -->
    <path id="leftArc" d="M 85,785 C 60,630 195,300 455,100" fill="none" />

    <!-- Right Text Path: KUSUMA BANGSA (apex curving down to bottom-right) -->
    <!-- Arc from (545, 100) curving down to (915, 785) -->
    <path id="rightArc" d="M 545,100 C 805,300 940,630 915,785" fill="none" />

    <!-- Bottom Text Path: BOGOR -->
    <!-- Arc from (190, 890) curving through center (500, 940) to (810, 890) -->
    <path id="bottomArc" d="M 120,855 C 330,955 670,955 880,855" fill="none" />
  </defs>

  <!-- Group with Drop Shadow -->
  <g filter="url(#subtleShadow)">
    <!-- 1. OUTER GOLD BORDER (Curved Reuleaux-like Rounded Triangle pointing UP) -->
    <!-- Top rounded corner at (500, 30), Right rounded corner at (960, 860), Left rounded corner at (40, 860) -->
    <path d="M 470,26 
             C 485,12 515,12 530,26 
             C 610,95 860,390 965,815 
             C 976,855 955,890 915,905 
             C 770,955 230,955 85,905 
             C 45,890 24,855 35,815 
             C 140,390 390,95 470,26 Z" 
          fill="url(#goldGradient)" />

    <!-- 2. INNER GREEN BODY -->
    <!-- Inset by ~36px -->
    <g id="greenShield">
      <!-- Base Green Shape -->
      <clipPath id="shieldClip">
        <path d="M 474,62 
                 C 487,51 513,51 526,62 
                 C 598,125 828,398 928,795 
                 C 938,832 918,862 882,875 
                 C 748,922 252,922 118,875 
                 C 82,862 62,832 72,795 
                 C 172,398 402,125 474,62 Z" />
      </clipPath>

      <g clip-path="url(#shieldClip)">
        <!-- Left Facet (Brighter Emerald) -->
        <path d="M 500,40 L 500,940 L 0,940 L 0,0 Z" fill="url(#greenLeftFacet)" />
        
        <!-- Right Facet (Darker Emerald) -->
        <path d="M 500,40 L 500,940 L 1000,940 L 1000,0 Z" fill="url(#greenRightFacet)" />

        <!-- Diagonal Facet Shadows for 3D depth -->
        <polygon points="500,530 0,940 500,940" fill="#005A28" opacity="0.45" />
        <polygon points="500,530 1000,940 500,940" fill="#004A20" opacity="0.65" />
        <polygon points="500,530 500,40 1000,0" fill="#004A20" opacity="0.15" />
      </g>
    </g>

    <!-- 3. TEXT ALONG PERIMETER -->
    <!-- Left Flank: YAYASAN PENDIDIKAN -->
    <text fill="#FFFFFF" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="4">
      <textPath href="#leftArc" startOffset="50%" text-anchor="middle">
        YAYASAN PENDIDIKAN
      </textPath>
    </text>

    <!-- Right Flank: KUSUMA BANGSA -->
    <text fill="#FFFFFF" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="4">
      <textPath href="#rightArc" startOffset="50%" text-anchor="middle">
        KUSUMA BANGSA
      </textPath>
    </text>

    <!-- Bottom Flank: ● BOGOR ● -->
    <g fill="#FFFFFF">
      <circle cx="250" cy="862" r="21" />
      <text x="500" y="904" text-anchor="middle" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="16">
        BOGOR
      </text>
      <circle cx="750" cy="862" r="21" />
    </g>

    <!-- 4. INNER WHITE ROUNDED TRIANGULAR CONTOUR -->
    <path d="M 478,205 
             C 489,188 511,188 522,205 
             C 582,298 732,548 792,725 
             C 804,760 782,795 745,804 
             C 630,830 370,830 255,804 
             C 218,795 196,760 208,725 
             C 268,548 418,298 478,205 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="19" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- 5. CENTER ISLAMIC GEOMETRIC STAR (8-Pointed Emblem / Rub el Hizb) -->
    <g transform="translate(500, 505)">
      <!-- Outer White 8-Pointed Star (Formed by two overlapping rounded squares) -->
      <g stroke="#FFFFFF" stroke-width="18" fill="none">
        <rect x="-155" y="-155" width="310" height="310" rx="14" />
        <rect x="-155" y="-155" width="310" height="310" rx="14" transform="rotate(45)" />
      </g>

      <!-- Inner Green Geometric Tiles (8 Diamonds / Squares) -->
      <!-- 4 Cardinal Green Squares -->
      <g fill="#00843D">
        <polygon points="0,-155 45,-110 0,-65 -45,-110" />
        <polygon points="0,155 45,110 0,65 -45,110" />
        <polygon points="-155,0 -110,-45 -65,0 -110,45" />
        <polygon points="155,0 110,-45 65,0 110,45" />
        
        <!-- 4 Diagonal Green Squares -->
        <g transform="rotate(45)">
          <polygon points="0,-155 45,-110 0,-65 -45,-110" />
          <polygon points="0,155 45,110 0,65 -45,110" />
          <polygon points="-155,0 -110,-45 -65,0 -110,45" />
          <polygon points="155,0 110,-45 65,0 110,45" />
        </g>
      </g>

      <!-- Shading on Star for 3D realism -->
      <g opacity="0.3" fill="#000000">
        <polygon points="0,0 155,0 110,45 0,0" />
        <polygon points="0,0 0,155 45,110 0,0" />
        <polygon points="0,0 110,110 78,78 0,0" />
      </g>

      <!-- Solid White 8-Pointed Central Star -->
      <path d="M 0,-85 
               L 24,-24 L 85,0 L 24,24 
               L 0,85 
               L -24,24 L -85,0 L -24,-24 Z" 
            fill="#FFFFFF" />
      <g transform="rotate(45)">
        <path d="M 0,-85 
                 L 24,-24 L 85,0 L 24,24 
                 L 0,85 
                 L -24,24 L -85,0 L -24,-24 Z" 
              fill="#FFFFFF" />
      </g>
    </g>

    <!-- 6. WHITE ARABIC CALLIGRAPHY: كوسوما بغسى -->
    <!-- Positioned elegantly below the 8-pointed star inside the white triangle -->
    <g transform="translate(500, 735)" fill="#FFFFFF">
      <!-- Flowing Arabic Text Script Kusuma Bangsa -->
      <!-- Sub-paths for characters and flourishes -->
      <!-- Main sweeping baseline flourishing to top right -->
      <path d="M -215,-40 
               C -215,-10 -205,8 -175,18 
               C -140,28 -70,30 20,30 
               C 110,30 180,15 240,-15 
               C 260,-25 265,-30 258,-32 
               C 252,-34 235,-20 180,-3 
               C 120,15 50,16 -20,16 
               C -100,16 -160,10 -185,-5 
               C -198,-13 -200,-28 -200,-40 Z" />

      <!-- Word 'Kusuma' (كوسوما) Calligraphy flourishes -->
      <!-- Kaf stroke -->
      <path d="M -215,-42 C -215,-60 -210,-72 -200,-72 C -192,-72 -192,-60 -195,-45 C -198,-32 -202,-20 -215,-42 Z" />
      <!-- Seen teeth -->
      <path d="M -160,-5 C -160,-20 -150,-24 -145,-15 C -142,-7 -140,-1 -133,-15 C -128,-23 -120,-18 -120,-5 Z" />
      <!-- Waw & Meem loop -->
      <path d="M -105,-2 C -105,-22 -75,-25 -75,-5 C -75,8 -105,10 -105,-2 Z M -95,-4 C -95,3 -82,2 -82,-5 C -82,-12 -95,-12 -95,-4 Z" />
      <path d="M -60,0 C -60,-20 -30,-22 -30,-3 C -30,10 -60,12 -60,0 Z M -50,-2 C -50,5 -38,4 -38,-3 C -38,-10 -50,-10 -50,-2 Z" />

      <!-- Word 'Bangsa' (بغسى) Calligraphy flourishes -->
      <!-- Ba & Ghain loop & teeth -->
      <path d="M 40,2 C 40,-18 70,-25 80,-8 C 88,6 60,18 40,2 Z M 52,-1 C 52,5 68,3 68,-4 C 68,-11 52,-9 52,-1 Z" />
      <!-- Dot above Ghain -->
      <circle cx="62" cy="-35" r="7" />
      <!-- Dot below Ba -->
      <circle cx="-5" cy="42" r="7" />

      <!-- Sweeping Ya tail curve & top accent marks -->
      <path d="M 120,-2 C 145,-12 175,-30 220,-60 C 230,-67 235,-65 230,-58 C 190,-15 150,5 120,-2 Z" />
      
      <!-- Calligraphic accent flourishes -->
      <path d="M -10,-12 C 5,-28 20,-32 15,-20 C 10,-8 -5,0 -10,-12 Z" />
      <path d="M 140,-32 C 155,-44 165,-42 160,-34 C 150,-20 135,-22 140,-32 Z" />
    </g>
  </g>
</svg>
